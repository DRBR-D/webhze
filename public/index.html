<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F7F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MangaFlow">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <script>
    try {
      var s = localStorage.getItem('color-scheme');
      if (s === 'light' || s === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = s;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.content = s === 'dark' ? '#0B0B10' : '#F8F7F4';
        });
      }
      if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('is-standalone');
      }
    } catch (e) {}
  </script>
  <title>MangaFlow — iOS &amp; macOS Manga Reader</title>
  <meta name="description" content="Trình đọc truyện phong cách iOS &amp; macOS Liquid Glass thích nghi từ điện thoại 4.8 inch đến máy tính để bàn.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <a href="#app-main" class="skip-link">Chuyển đến nội dung chính</a>

    <!-- macOS Floating Liquid Glass Sidebar (Desktop >= 900px) -->
    <aside id="mac-sidebar" class="mac-sidebar glass-regular" aria-label="Thanh điều hướng ứng dụng">
      <div class="sidebar-top">
        <a href="/" class="brand-link" data-spa-link>
          <span class="brand-mark" aria-hidden="true">M</span>
          <span class="brand-name">MangaFlow</span>
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Chính">
        <div class="sidebar-group">
          <span class="sidebar-group-title">Khám phá</span>
          <a href="/" class="sidebar-item" data-spa-link data-nav-route="home">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.06l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 0 0 1.061 1.06l8.69-8.69Z"/><path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/></svg>
            <span>Trang chủ</span>
          </a>
          <a href="/search" class="sidebar-item" data-spa-link data-nav-route="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z" clip-rule="evenodd"/></svg>
            <span>Tìm kiếm</span>
          </a>
          <button type="button" id="sidebar-random-btn" class="sidebar-item">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M10.59 9.17 5.41 4 4 5.41l5.17 5.17 1.42-1.41ZM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5Zm.33 9.41-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13Z"/></svg>
            <span>Ngẫu nhiên</span>
          </button>
        </div>

        <div class="sidebar-group">
          <span class="sidebar-group-title">Thư viện</span>
          <a href="/favorites" class="sidebar-item" data-spa-link data-nav-route="favorites">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z"/></svg>
            <span>Yêu thích</span>
          </a>
          <a href="/history" class="sidebar-item" data-spa-link data-nav-route="history">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z" clip-rule="evenodd"/></svg>
            <span>Lịch sử đọc</span>
          </a>
          <a href="/downloads" class="sidebar-item" data-spa-link data-nav-route="downloads">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.25a.75.75 0 0 1 .75.75v11.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 1 1 1.06-1.06l3.22 3.22V3a.75.75 0 0 1 .75-.75Zm-9 13.5a.75.75 0 0 1 .75.75v2.25a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5V16.5a.75.75 0 0 1 1.5 0v2.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V16.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd"/></svg>
            <span>Tải offline</span>
          </a>
        </div>
      </nav>
    </aside>

    <div class="app-stage">
      <!-- Unified Translucent Top Bar (iOS Inline Nav Bar + macOS Window Toolbar) -->
      <header id="top-header" class="top-header">
        <div class="top-header-inner">
          <div class="header-leading">
            <button type="button" id="sidebar-toggle-btn" class="glass-icon-btn desktop-only" aria-label="Ẩn hoặc hiện thanh bên" aria-expanded="true" title="Thanh bên (⌘\)">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><line x1="9" y1="4" x2="9" y2="20"/></svg>
            </button>

            <div class="mac-history-nav desktop-only" role="group" aria-label="Lịch sử trang">
              <button type="button" id="nav-back-btn" class="glass-icon-btn compact" aria-label="Quay lại">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
              </button>
              <button type="button" id="nav-forward-btn" class="glass-icon-btn compact" aria-label="Tiến tới">
                <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
              </button>
            </div>

            <a href="/" class="brand-link mobile-only" data-spa-link>
              <span class="brand-mark" aria-hidden="true">M</span>
              <span class="brand-name">MangaFlow</span>
            </a>

            <span id="toolbar-title" class="toolbar-title" aria-hidden="true">Trang chủ</span>
          </div>

          <!-- Tablet Compact Floating Pill Nav (768px–899px) -->
          <nav class="tablet-nav glass-regular" aria-label="Điều hướng máy tính bảng">
            <a href="/" class="nav-pill" data-spa-link data-nav-route="home">Trang chủ</a>
            <a href="/search" class="nav-pill" data-spa-link data-nav-route="search">Tìm kiếm</a>
            <a href="/favorites" class="nav-pill" data-spa-link data-nav-route="favorites">Yêu thích</a>
            <a href="/history" class="nav-pill" data-spa-link data-nav-route="history">Lịch sử</a>
            <a href="/downloads" class="nav-pill" data-spa-link data-nav-route="downloads">Tải về</a>
          </nav>

          <div class="header-trailing">
            <form id="toolbar-search-form" class="toolbar-search desktop-only" role="search">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z" clip-rule="evenodd"/></svg>
              <input id="toolbar-search-input" type="search" placeholder="Tìm truyện hoặc ID..." enterkeyhint="search" autocapitalize="none" autocorrect="off" aria-label="Tìm nhanh truyện hoặc ID">
              <kbd class="kbd-hint" aria-hidden="true">⌘K</kbd>
            </form>

            <button type="button" id="rewards-open-btn" class="glass-pill-btn points-chip" aria-label="Điểm thưởng, điểm danh và cài đặt giao diện">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="currentColor" aria-hidden="true"><path d="M11.48 3.499a.562.562 0 0 1 1.04 0l2.125 5.111a.563.563 0 0 0 .475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 0 0-.182.557l1.285 5.385a.562.562 0 0 1-.84.61l-4.725-2.885a.562.562 0 0 0-.586 0L6.982 20.54a.562.562 0 0 1-.84-.61l1.285-5.386a.562.562 0 0 0-.182-.557l-4.204-3.602a.562.562 0 0 1 .321-.988l5.518-.442a.563.563 0 0 0 .475-.345L11.48 3.5Z"/></svg>
              <span id="header-points-value" class="tabular-nums">300</span>
            </button>

            <button type="button" id="theme-toggle-btn" class="glass-icon-btn theme-toggle-btn">
              <span class="theme-option theme-when-light">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M9.528 1.718a.75.75 0 0 1 .162.819A8.97 8.97 0 0 0 9 6a9 9 0 0 0 9 9 8.97 8.97 0 0 0 3.463-.69.75.75 0 0 1 .981.98 10.503 10.503 0 0 1-9.694 6.46c-5.799 0-10.5-4.7-10.5-10.5 0-4.368 2.667-8.112 6.46-9.694a.75.75 0 0 1 .818.162Z" clip-rule="evenodd"/></svg>
                <span class="visually-hidden">Chuyển sang giao diện tối</span>
              </span>
              <span class="theme-option theme-when-dark">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M12 2.25a.75.75 0 0 1 .75.75v2.25a.75.75 0 0 1-1.5 0V3a.75.75 0 0 1 .75-.75ZM7.5 12a4.5 4.5 0 1 1 9 0 4.5 4.5 0 0 1-9 0ZM18.894 6.166a.75.75 0 0 0-1.06-1.06l-1.591 1.59a.75.75 0 1 0 1.06 1.061l1.591-1.59ZM21.75 12a.75.75 0 0 1-.75.75h-2.25a.75.75 0 0 1 0-1.5H21a.75.75 0 0 1 .75.75ZM17.834 18.894a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 1 0-1.061 1.06l1.59 1.591ZM12 18a.75.75 0 0 1 .75.75V21a.75.75 0 0 1-1.5 0v-2.25A.75.75 0 0 1 12 18ZM7.758 17.303a.75.75 0 0 0-1.061-1.06l-1.591 1.59a.75.75 0 0 0 1.06 1.061l1.591-1.59ZM6 12a.75.75 0 0 1-.75.75H3a.75.75 0 0 1 0-1.5h2.25A.75.75 0 0 1 6 12ZM6.697 7.757a.75.75 0 0 0 1.06-1.06l-1.59-1.591a.75.75 0 0 0-1.061 1.06l1.59 1.591Z"/></svg>
                <span class="visually-hidden">Chuyển sang giao diện sáng</span>
              </span>
            </button>
          </div>
        </div>
      </header>

      <main id="app-main" class="app-main" tabindex="-1"></main>
    </div>

    <!-- iOS 26 Floating Liquid Glass Capsule Tab Bar (Mobile < 768px) -->
    <div class="ios-tabbar-scrim" aria-hidden="true"></div>
    <nav class="mobile-bottom-nav glass-regular" aria-label="Điều hướng di động">
      <a href="/" class="bottom-nav-item" data-spa-link data-nav-route="home">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.06l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 0 0 1.061 1.06l8.69-8.69Z"/><path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/></svg>
        <span>Khám phá</span>
      </a>
      <a href="/search" class="bottom-nav-item" data-spa-link data-nav-route="search">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M10.5 3.75a6.75 6.75 0 1 0 0 13.5 6.75 6.75 0 0 0 0-13.5ZM2.25 10.5a8.25 8.25 0 1 1 14.59 5.28l4.69 4.69a.75.75 0 1 1-1.06 1.06l-4.69-4.69A8.25 8.25 0 0 1 2.25 10.5Z" clip-rule="evenodd"/></svg>
        <span>Tìm kiếm</span>
      </a>
      <a href="/favorites" class="bottom-nav-item" data-spa-link data-nav-route="favorites">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z"/></svg>
        <span>Yêu thích</span>
      </a>
      <a href="/history" class="bottom-nav-item" data-spa-link data-nav-route="history">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.25c-5.385 0-9.75 4.365-9.75 9.75s4.365 9.75 9.75 9.75 9.75-4.365 9.75-9.75S17.385 2.25 12 2.25ZM12.75 6a.75.75 0 0 0-1.5 0v6c0 .414.336.75.75.75h4.5a.75.75 0 0 0 0-1.5h-3.75V6Z" clip-rule="evenodd"/></svg>
        <span>Lịch sử</span>
      </a>
      <a href="/downloads" class="bottom-nav-item" data-spa-link data-nav-route="downloads">
        <svg viewBox="0 0 24 24" width="21" height="21" fill="currentColor" aria-hidden="true"><path fill-rule="evenodd" d="M12 2.25a.75.75 0 0 1 .75.75v11.69l3.22-3.22a.75.75 0 1 1 1.06 1.06l-4.5 4.5a.75.75 0 0 1-1.06 0l-4.5-4.5a.75.75 0 1 1 1.06-1.06l3.22 3.22V3a.75.75 0 0 1 .75-.75Zm-9 13.5a.75.75 0 0 1 .75.75v2.25a1.5 1.5 0 0 0 1.5 1.5h13.5a1.5 1.5 0 0 0 1.5-1.5V16.5a.75.75 0 0 1 1.5 0v2.25a3 3 0 0 1-3 3H5.25a3 3 0 0 1-3-3V16.5a.75.75 0 0 1 .75-.75Z" clip-rule="evenodd"/></svg>
        <span>Tải về</span>
      </a>
    </nav>
  </div>

  <!-- iOS Bottom Sheet / macOS Modal Sheet -->
  <dialog id="rewards-dialog" class="app-dialog glass-regular" closedby="any" aria-labelledby="rewards-dialog-title">
    <div class="sheet-drag-zone" data-sheet-handle>
      <span class="sheet-grabber" aria-hidden="true"></span>
      <div class="dialog-header">
        <h2 id="rewards-dialog-title">Điểm thưởng &amp; Cài đặt</h2>
        <button type="button" id="rewards-close-btn" class="sheet-done-btn" aria-label="Xong và đóng hộp thoại">Xong</button>
      </div>
    </div>
    <div id="rewards-dialog-body" class="dialog-body"></div>
  </dialog>

  <div id="toast-region" class="toast-region glass-regular" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
