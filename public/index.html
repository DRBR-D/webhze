<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F8F7F4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0B0B10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="MANGA">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png">
  <script>
    try {
      var s = localStorage.getItem('color-scheme');
      if (s === 'light' || s === 'dark') {
        document.querySelector('meta[name="color-scheme"]').content = s;
        document.querySelectorAll('meta[name="theme-color"]').forEach(function (m) {
          m.content = s === 'dark' ? '#0B0B10' : '#F8F7F4';
        });
      }
      if (window.navigator.standalone === true || window.matchMedia('(display-mode: standalone)').matches) {
        document.documentElement.classList.add('is-standalone');
      }
    } catch (e) {}
  </script>
  <title>MANGA — Kinetic Reader</title>
  <meta name="description" content="Trình đọc truyện Kinetic Reader thích nghi từ điện thoại 4.8 inch đến PC.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div id="app-shell" class="app-shell">
    <a href="#app-main" class="skip-link">Chuyển đến nội dung chính</a>

    <!-- Drawer backdrop on mobile/tablet (< 900px) -->
    <div id="drawer-scrim" class="drawer-scrim" hidden></div>

    <!-- Navigation Drawer (Slide-out on Mobile, Docked Sidebar on PC >= 900px) -->
    <aside id="nav-drawer" class="nav-drawer" aria-label="Menu điều hướng">
      <div class="drawer-brand-row">
        <span class="drawer-avatar" aria-hidden="true">M</span>
        <div class="drawer-brand-text">
          <strong class="drawer-brand-title">MANGA</strong>
          <span class="drawer-brand-sub">KINETIC READER</span>
        </div>
        <button type="button" id="drawer-close-btn" class="icon-btn compact mobile-drawer-only" aria-label="Đóng menu">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="drawer-session-line">
        <span class="status-dot" aria-hidden="true"></span>
        <span>Active Session</span>
      </div>

      <div class="drawer-divider" aria-hidden="true"></div>

      <nav class="drawer-nav" aria-label="Workspace">
        <span class="drawer-section-label">WORKSPACE</span>
        <a href="/" class="drawer-item" data-spa-link data-nav-route="home">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="currentColor" aria-hidden="true"><path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.06l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 0 0 1.061 1.06l8.69-8.69Z"/><path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/></svg>
          <span>Home</span>
        </a>
        <a href="/search" class="drawer-item" data-spa-link data-nav-route="search">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span>
        </a>
        <a href="/favorites" class="drawer-item" data-spa-link data-nav-route="favorites">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" aria-hidden="true"><path d="M12 20.5s-7.5-4.7-9.2-9.2C1.6 8 3.6 4.5 7.2 4.5c2 0 3.7 1.1 4.8 2.7 1.1-1.6 2.8-2.7 4.8-2.7 3.6 0 5.6 3.5 4.4 6.8-1.7 4.5-9.2 9.2-9.2 9.2Z"/></svg>
          <span>Favorites</span>
          <span id="drawer-fav-count" class="drawer-count-pill pink tabular-nums" hidden>0</span>
        </a>
        <a href="/history" class="drawer-item" data-spa-link data-nav-route="history">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.8l3.2 2"/></svg>
          <span>History</span>
          <span id="drawer-history-count" class="drawer-count-pill amber tabular-nums" hidden>0</span>
        </a>
        <a href="/downloads" class="drawer-item" data-spa-link data-nav-route="downloads">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 18.5h16"/></svg>
          <span>Downloads</span>
          <span id="drawer-saved-count" class="drawer-count-pill sky tabular-nums" hidden>0</span>
        </a>
      </nav>

      <div class="drawer-appearance">
        <span class="drawer-section-label">APPEARANCE</span>
        <button type="button" id="theme-toggle-btn" class="appearance-switch-row" aria-label="Đổi giao diện Sáng hoặc Tối">
          <span class="appearance-label-group">
            <span class="theme-when-light">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
              <span>Light Theme</span>
            </span>
            <span class="theme-when-dark">
              <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true"><path d="M11.6 2.6a.75.75 0 0 1 .2.8A8 8 0 0 0 20.6 14a.75.75 0 0 1 .9.95A9.5 9.5 0 1 1 10.8 2.4a.75.75 0 0 1 .8.2Z"/></svg>
              <span>Dark Theme</span>
            </span>
          </span>
          <span class="ios-switch-track" aria-hidden="true"><span class="ios-switch-thumb"></span></span>
        </button>
      </div>

      <div id="drawer-install-slot"></div>

      <div class="drawer-overview">
        <span class="drawer-section-label">LIBRARY OVERVIEW</span>
        <div class="overview-stats-grid">
          <a href="/favorites" class="overview-stat" data-spa-link>
            <strong id="overview-fav-num" class="stat-num pink tabular-nums">0</strong>
            <span>Favs</span>
          </a>
          <a href="/history" class="overview-stat" data-spa-link>
            <strong id="overview-history-num" class="stat-num amber tabular-nums">0</strong>
            <span>History</span>
          </a>
          <a href="/downloads" class="overview-stat" data-spa-link>
            <strong id="overview-saved-num" class="stat-num sky tabular-nums">0</strong>
            <span>Saved</span>
          </a>
        </div>
      </div>
    </aside>

    <!-- Main Scroll Stage -->
    <div class="app-stage">
      <!-- Adaptive Top Bar: Floating Over Hero on Home, Crisp Header on Scroll -->
      <header id="top-header" class="top-header">
        <div class="top-header-inner">
          <button type="button" id="menu-open-btn" class="header-circle-btn glass-clear" aria-label="Mở menu điều hướng">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h12"/></svg>
          </button>

          <span id="toolbar-title" class="toolbar-brand-title">MANGA</span>

          <div class="header-right-group">
            <form id="toolbar-search-form" class="toolbar-search desktop-only" role="search">
              <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2.1" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
              <input id="toolbar-search-input" type="search" placeholder="Search tags, titles, #ID..." enterkeyhint="search" autocapitalize="none" autocorrect="off" aria-label="Tìm nhanh truyện hoặc ID">
              <kbd class="kbd-hint" aria-hidden="true">⌘K</kbd>
            </form>

            <a href="/search" id="header-search-btn" class="header-circle-btn glass-clear" data-spa-link aria-label="Tìm kiếm">
              <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
            </a>
          </div>
        </div>
      </header>

      <main id="app-main" class="app-main" tabindex="-1"></main>
    </div>

    <!-- Floating Crystal Liquid Glass Bottom Tab Bar (Mobile / Tablet < 900px) -->
    <nav class="mobile-bottom-nav glass-regular" aria-label="Điều hướng chính">
      <a href="/" class="bottom-nav-item" data-spa-link data-nav-route="home">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M11.47 3.84a.75.75 0 0 1 1.06 0l8.69 8.69a.75.75 0 1 0 1.06-1.06l-8.689-8.69a2.25 2.25 0 0 0-3.182 0l-8.69 8.69a.75.75 0 0 0 1.061 1.06l8.69-8.69Z"/><path d="m12 5.432 8.159 8.159c.03.03.06.058.091.086v6.198c0 1.035-.84 1.875-1.875 1.875H15a.75.75 0 0 1-.75-.75v-4.5a.75.75 0 0 0-.75-.75h-3a.75.75 0 0 0-.75.75V21a.75.75 0 0 1-.75.75H5.625a1.875 1.875 0 0 1-1.875-1.875v-6.198a2.29 2.29 0 0 0 .091-.086L12 5.432Z"/></svg>
        </span>
        <span>Home</span>
      </a>
      <a href="/search" class="bottom-nav-item" data-spa-link data-nav-route="search">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </span>
        <span>Search</span>
      </a>
      <a href="/favorites" class="bottom-nav-item" data-spa-link data-nav-route="favorites">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="m11.645 20.91-.007-.003-.022-.012a15.247 15.247 0 0 1-.383-.218 25.18 25.18 0 0 1-4.244-3.17C4.688 15.36 2.25 12.174 2.25 8.25 2.25 5.322 4.714 3 7.688 3A5.5 5.5 0 0 1 12 5.052 5.5 5.5 0 0 1 16.313 3c2.973 0 5.437 2.322 5.437 5.25 0 3.925-2.438 7.111-4.739 9.256a25.175 25.175 0 0 1-4.244 3.17 15.247 15.247 0 0 1-.383.219l-.022.012-.007.004-.003.001a.752.752 0 0 1-.704 0l-.003-.001Z"/></svg>
          <span id="tab-fav-dot" class="tab-dot pink" hidden></span>
        </span>
        <span>Favs</span>
      </a>
      <a href="/history" class="bottom-nav-item" data-spa-link data-nav-route="history">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.8l3.2 2"/></svg>
          <span id="tab-history-dot" class="tab-dot amber" hidden></span>
        </span>
        <span>History</span>
      </a>
      <a href="/downloads" class="bottom-nav-item" data-spa-link data-nav-route="downloads">
        <span class="nav-icon-wrap">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11m0 0-4-4m4 4 4-4M4 18.5h16"/></svg>
          <span id="tab-saved-dot" class="tab-dot sky" hidden></span>
        </span>
        <span>Saved</span>
      </a>
    </nav>
  </div>

  <!-- Reusable iOS Bottom Sheet / Desktop Modal Sheet (Ranking, Daily, Points Wallet, Coupons) -->
  <dialog id="app-sheet" class="app-dialog glass-regular" closedby="any" aria-labelledby="app-sheet-title">
    <div class="sheet-drag-zone" data-sheet-handle>
      <span class="sheet-grabber" aria-hidden="true"></span>
      <div class="dialog-header">
        <h2 id="app-sheet-title">Sheet</h2>
        <button type="button" id="app-sheet-close" class="icon-btn compact" aria-label="Đóng">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>
    </div>
    <div id="app-sheet-body" class="dialog-body"></div>
  </dialog>

  <div id="toast-region" class="toast-region glass-regular" role="status" aria-live="polite"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
